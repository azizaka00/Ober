<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 130" width="384" height="130" role="img" aria-label="OBER">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Monogram: O halqasi — "bozor davrasi" -->
  <circle cx="65" cy="65" r="40" fill="none" stroke="#0a2b63" stroke-width="11"/>
  <!-- O'rtadagi amber nuqta: talab-taklif kesishmasi -->
  <circle cx="65" cy="65" r="10" fill="url(#amber)"/>
  <!-- So'z: ober -->
  <text x="130" y="82" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,Roboto,Arial,sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1" fill="#0a2b63">ober</text>
  <!-- Tagline -->
  <text x="132" y="106" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,Roboto,Arial,sans-serif"
        font-size="13" font-weight="600" letter-spacing="3.2" fill="#637087">BOZOR JAVOB BERADI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OBER">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- To'liq qoplovchi navy asos (Play/App Store talabi: ikon to'liq kvadrat) -->
  <rect x="0" y="0" width="512" height="512" fill="#0a2b63"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0a2b63"/>
  <!-- O halqasi -->
  <circle cx="256" cy="248" r="148" fill="none" stroke="#ffffff" stroke-width="34"/>
  <!-- Markazdagi amber nuqta — talab va taklif kesishgan joy -->
  <circle cx="256" cy="248" r="40" fill="url(#amber)"/>
  <!-- Pastki amber chiziq: harakat -->
  <rect x="172" y="364" width="168" height="18" rx="9" fill="url(#amber)"/>

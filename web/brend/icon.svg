<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="OBER">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Navy yumaloq asos -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0a2b63"/>
  <!-- O halqasi -->
  <circle cx="128" cy="124" r="74" fill="none" stroke="#ffffff" stroke-width="17"/>
  <!-- Markazdagi amber nuqta — talab va taklif kesishgan joy -->
  <circle cx="128" cy="124" r="20" fill="url(#amber)"/>
  <!-- Pastki amber chiziq: harakat -->
  <rect x="86" y="182" width="84" height="9" rx="4.5" fill="url(#amber)"/>
</svg>
